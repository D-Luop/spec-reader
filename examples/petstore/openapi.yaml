openapi: 3.1.0
info:
  title: Petstore
  version: 1.0.0
  description: A tiny API used to demonstrate Spec Reader.
servers:
  - url: https://petstore3.swagger.io
paths:
  /api/v3/pet/{petId}:
    get:
      operationId: getPet
      summary: Find a pet by ID
      tags: [Pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Pet"}
        "404": {description: Pet not found}
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
