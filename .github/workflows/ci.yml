name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24'}
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: go test ./...
      - run: pnpm install --frozen-lockfile && pnpm lint && pnpm build
        working-directory: web
      - run: docker build -t spec-reader:test .
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/metadata-action@v5
        id: meta
        with: {images: ghcr.io/d-luop/spec-reader, tags: 'type=semver,pattern={{version}}\ntype=raw,value=latest'}
      - uses: docker/build-push-action@v6
        with: {context: ., platforms: linux/amd64,linux/arm64, push: true, tags: '${{ steps.meta.outputs.tags }}', labels: '${{ steps.meta.outputs.labels }}'}
